name: maimons-platform

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: platform-docker-proxy
    environment:
      CONTAINERS: 1
      INFO: 1
      PING: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 50
    read_only: true
    tmpfs:
      - /run:size=8m,mode=0755
      - /var/lib/haproxy:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: &platform-logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  monitoring:
    image: 236565801201.dkr.ecr.eu-central-1.amazonaws.com/monitoring:latest
    container_name: platform-monitoring
    depends_on:
      docker-proxy:
        condition: service_started
    environment:
      SERVICE_VERSION: ${SERVICE_TAG:-latest}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_ANALYTICS_API_TOKEN:-cfat_79hJVYuKnG4KfqYGzwWk14UmQOyf1CxWJor14NbQe1602a37}
      CLOUDFLARE_HOSTNAMES: ${CLOUDFLARE_ANALYTICS_HOSTNAMES:-monitor.maimons.dev,mosar.maimons.org,notes.maimons.dev,dmarcer.maimons.dev,kubeman.maimons.dev}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ANALYTICS_ZONE_ID:-6f74b16f5d9fbaa7ec6c57253dc321e8}
      CLOUDFLARE_ZONE_NAME: ${CLOUDFLARE_ANALYTICS_ZONE_NAME:-maimons.dev}
      DOCKER_API_URL: http://docker-proxy:2375
      HISTORY_DB_PATH: /data/history.sqlite3
      HISTORY_RETENTION_DAYS: 30
      HISTORY_SAMPLE_INTERVAL_SECONDS: 60
      TUNNEL_METRICS_URL: http://host.docker.internal:20241/metrics
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app-egress
      - monitoring
    volumes:
      - monitoring-history:/data
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *platform-logging

networks:
  app-egress:
    name: platform-app-egress
  monitoring:
    internal: true
    name: platform-monitoring

volumes:
  monitoring-history:
    name: platform-monitoring-history

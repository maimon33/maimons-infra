name: Deploy Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Force deployment even if no Terraform changes
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - 'modules/cloudflare-tunnel/**'
      - 'modules/ec2-startup/**'
      - 'environments/prod/cloudflare-tunnel.tf'
      - 'platform/compose.yaml'
      - 'platform/traefik/**'
      - '.github/workflows/deploy-tunnel.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-tunnel:
    uses: ./.github/workflows/deploy-service.yml@main
    with:
      service_name: tunnel-daemon
      docker_compose_path: ./platform/compose.yaml
      terraform_path: ./
      port: "80"
      health_check_url: http://localhost/ping
      health_check_timeout: "30"
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
